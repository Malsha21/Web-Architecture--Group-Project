<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinhala Letter Match | EduLanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+Sinhala:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbf6;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6478;
    --blue: #1a5cff;
    --blue-dark: #1246c9;
    --yellow: #f7b500;
    --yellow-dark: #d98f00;
    --green: #1f9d55;
    --green-soft: #dcf7e6;
    --red: #d64545;
    --red-soft: #fde4e4;
    --lilac: #f3e8ff;
    --line: #e7e5dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", "Noto Sans Sinhala", "Nirmala UI", "Iskoola Pota", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .si { font-family: "Noto Sans Sinhala", "Nirmala UI", "Iskoola Pota", "Nunito", sans-serif; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 900; font-size: 22px; color: #1d3a8a; text-decoration: none; }
  .back {
    font-weight: 800; color: var(--ink); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; background: #fff;
  }
  .back:hover { border-color: var(--blue); color: var(--blue); }

  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .panel {
    background: var(--card); border-radius: 32px; padding: 28px;
    box-shadow: 0 10px 30px rgba(20, 33, 61, .08);
  }
  .hidden { display: none !important; }

  /* Start screen */
  .start { text-align: center; }
  .start .icon {
    width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 28px;
    background: var(--lilac); display: grid; place-items: center; font-size: 60px;
  }
  .start h1 { font-size: 40px; margin: 0 0 8px; font-weight: 900; }
  .start p { color: var(--muted); font-size: 18px; margin: 0 0 26px; line-height: 1.5; }

  .btn-main {
    font: inherit; font-weight: 900; font-size: 20px; cursor: pointer; border: 0;
    color: #fff; background: var(--blue); padding: 16px 40px; border-radius: 999px;
    box-shadow: 0 5px 0 var(--blue-dark);
  }
  .btn-main:hover { background: #2a68ff; }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-dark); }
  .btn-yellow { background: var(--yellow); color: #3a2a00; box-shadow: 0 5px 0 var(--yellow-dark); }
  .btn-yellow:hover { background: #ffc61f; }
  .btn-yellow:active { box-shadow: 0 2px 0 var(--yellow-dark); }
  .btn-line {
    font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block;
    padding: 14px 30px; border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn-line:hover { border-color: var(--blue); color: var(--blue); }

  /* Game screen */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; font-weight: 800; }
  .chip { background: #fff7db; color: #7a5600; border-radius: 999px; padding: 6px 14px; }
  .bar { height: 14px; background: #eef0f6; border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .35s ease; }

  .picture {
    width: 170px; height: 170px; margin: 0 auto 14px; border-radius: 36px;
    background: var(--lilac); display: grid; place-items: center; font-size: 100px; line-height: 1;
  }
  .prompt { text-align: center; font-weight: 800; font-size: 20px; margin: 0; }
  .prompt-si { text-align: center; color: var(--muted); font-size: 16px; margin: 4px 0 24px; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .answer {
    font: inherit; font-family: "Noto Sans Sinhala", "Nirmala UI", "Iskoola Pota", sans-serif;
    font-weight: 700; font-size: 44px; cursor: pointer; line-height: 1.4;
    padding: 14px 10px; border-radius: 22px; border: 2px solid var(--line); background: #fff; color: var(--ink);
    transition: transform .1s ease, border-color .1s ease;
  }
  .answer:hover:not(:disabled) { border-color: var(--blue); transform: translateY(-2px); }
  .answer:disabled { cursor: default; }
  .answer.right { background: var(--green-soft); border-color: var(--green); color: #0f6b38; }
  .answer.wrong { background: var(--red-soft); border-color: var(--red); color: #9b2323; }

  .feedback { min-height: 56px; text-align: center; font-weight: 800; font-size: 19px; margin-top: 20px; line-height: 1.4; }
  .feedback.good { color: var(--green); }
  .feedback.bad { color: var(--red); }

  /* Result screen */
  .result { text-align: center; }
  .stars { font-size: 56px; letter-spacing: 6px; margin-bottom: 6px; }
  .result h2 { font-size: 34px; margin: 0 0 8px; font-weight: 900; }
  .result .score { font-size: 20px; color: var(--muted); margin: 0 0 18px; }
  .reward { display: inline-block; background: #fff7db; color: #7a5600; font-weight: 900; font-size: 22px; padding: 10px 22px; border-radius: 999px; margin-bottom: 8px; }
  .save-note { font-size: 14px; color: var(--muted); margin: 6px 0 26px; min-height: 20px; }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    .panel { padding: 20px; border-radius: 26px; }
    .picture { width: 140px; height: 140px; font-size: 80px; }
    .answer { font-size: 36px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html">EduLanka</a>
  <!-- CHANGE this link to your real Games page address -->
  <a class="back" href="games.html">Back to games</a>
</header>

<main>

  <!-- 1. Start screen -->
  <section class="panel start" id="startScreen">
    <div class="icon" aria-hidden="true">🐘</div>
    <h1>Sinhala Letter Match</h1>
    <p>Look at the picture and choose how its Sinhala name begins. Every right answer earns you 10 coins.</p>
    <button class="btn-main btn-yellow" id="startBtn">Start playing</button>
  </section>

  <!-- 2. Game screen -->
  <section class="panel hidden" id="gameScreen" aria-live="polite">
    <div class="hud">
      <span class="chip" id="qCount">Question 1 of 10</span>
      <span class="chip" id="scoreChip">Coins: 0</span>
    </div>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
    <div class="picture" id="picture" role="img" aria-label="Picture"></div>
    <p class="prompt">How does this word begin?</p>
    <p class="prompt-si si">මෙය ආරම්භ වන්නේ කුමන අකුරෙන්ද?</p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- 3. Result screen -->
  <section class="panel result hidden" id="resultScreen">
    <div class="stars" id="resultStars" aria-hidden="true"></div>
    <h2 id="resultTitle">Well done!</h2>
    <p class="score" id="resultScore"></p>
    <div class="reward" id="resultReward"></div>
    <p class="save-note" id="saveNote"></p>
    <div class="result-actions">
      <button class="btn-main" id="againBtn">Play again</button>
      <a class="btn-line" href="games.html">Back to games</a>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  var TOTAL_QUESTIONS = 10;
  var COINS_PER_CORRECT = 10;

  // Each word: Sinhala word (w), English meaning (en), picture (e),
  // and the full starting sound (l), including its vowel sign.
  var WORDS = [
    { w: "අලියා",    en: "elephant", e: "🐘", l: "අ" },
    { w: "අඹ",       en: "mango",    e: "🥭", l: "අ" },
    { w: "ඇපල්",     en: "apple",    e: "🍎", l: "ඇ" },
    { w: "ඇස",       en: "eye",      e: "👁️", l: "ඇ" },
    { w: "ඉබ්බා",    en: "turtle",   e: "🐢", l: "ඉ" },
    { w: "ඉර",       en: "sun",      e: "🌞", l: "ඉ" },
    { w: "ඌරා",      en: "pig",      e: "🐖", l: "ඌ" },
    { w: "එළුවා",    en: "goat",     e: "🐐", l: "එ" },
    { w: "ඔටුවා",    en: "camel",    e: "🐪", l: "ඔ" },
    { w: "ඔරලෝසුව",  en: "clock",    e: "⏰", l: "ඔ" },
    { w: "කුකුළා",   en: "rooster",  e: "🐓", l: "කු" },
    { w: "කුරුල්ලා", en: "bird",     e: "🐦", l: "කු" },
    { w: "කෙසෙල්",   en: "banana",   e: "🍌", l: "කෙ" },
    { w: "කොළ",      en: "leaf",     e: "🍃", l: "කො" },
    { w: "ගස",       en: "tree",     e: "🌳", l: "ග" },
    { w: "ගෙදර",     en: "house",    e: "🏠", l: "ගෙ" },
    { w: "ජලය",      en: "water",    e: "💧", l: "ජ" },
    { w: "තරුව",     en: "star",     e: "⭐", l: "ත" },
    { w: "දොර",      en: "door",     e: "🚪", l: "දො" },
    { w: "නාසය",     en: "nose",     e: "👃", l: "නා" },
    { w: "පොත",      en: "book",     e: "📖", l: "පො" },
    { w: "පාන්",     en: "bread",    e: "🍞", l: "පා" },
    { w: "පැන්සල",   en: "pencil",   e: "✏️", l: "පැ" },
    { w: "බළලා",     en: "cat",      e: "🐈", l: "බ" },
    { w: "බල්ලා",    en: "dog",      e: "🐕", l: "බ" },
    { w: "බෝලය",     en: "ball",     e: "⚽", l: "බෝ" },
    { w: "මල",       en: "flower",   e: "🌸", l: "ම" },
    { w: "මාළුවා",   en: "fish",     e: "🐟", l: "මා" },
    { w: "මීයා",     en: "mouse",    e: "🐁", l: "මී" },
    { w: "වඳුරා",    en: "monkey",   e: "🐒", l: "ව" },
    { w: "සඳ",       en: "moon",     e: "🌙", l: "ස" },
    { w: "හාවා",     en: "rabbit",   e: "🐇", l: "හා" }
  ];

  // Building blocks for the wrong answers
  var VOWELS = ["අ","ආ","ඇ","ඉ","ඊ","උ","ඌ","එ","ඒ","ඔ"];
  var CONSONANTS = ["ක","ග","ජ","ත","ද","න","ප","බ","ම","ව","ස","හ","ර","ල","ය","ට","ඩ","ච"];
  var SIGNS = ["","ා","ැ","ි","ී","ු","ූ","ෙ","ේ","ො","ෝ"];

  var current = 0;
  var correct = 0;
  var locked = false;
  var roundWords = [];
  var currentWord = null;

  var $ = function (id) { return document.getElementById(id); };
  var startScreen = $("startScreen"), gameScreen = $("gameScreen"), resultScreen = $("resultScreen");

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = rand(0, i);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pick(list) { return list[rand(0, list.length - 1)]; }

  function makeOptions(answer) {
    var options = [answer];
    var tries = 0;

    function add(x) {
      if (x && options.indexOf(x) === -1) options.push(x);
    }

    if (VOWELS.indexOf(answer) !== -1) {
      // Starts with a vowel: use other vowels and one plain consonant
      while (options.length < 3 && tries++ < 100) add(pick(VOWELS));
      while (options.length < 4 && tries++ < 200) add(pick(CONSONANTS));
    } else {
      var base = answer.charAt(0);
      var sign = answer.slice(1);
      while (options.length < 4 && tries++ < 300) {
        var n = options.length;
        if (n === 1) add(base + pick(SIGNS));                 // same letter, different vowel sign
        else if (n === 2) add(pick(CONSONANTS) + sign);       // different letter, same vowel sign
        else add(pick(CONSONANTS) + pick(SIGNS));             // anything else
      }
    }
    return shuffle(options);
  }

  // ---------- Show a question ----------
  function showQuestion() {
    locked = false;
    currentWord = roundWords[current];
    $("qCount").textContent = "Question " + (current + 1) + " of " + TOTAL_QUESTIONS;
    $("scoreChip").textContent = "Coins: " + (correct * COINS_PER_CORRECT);
    $("barFill").style.width = (current / TOTAL_QUESTIONS * 100) + "%";
    $("picture").textContent = currentWord.e;
    $("picture").setAttribute("aria-label", currentWord.en);
    $("feedback").textContent = "";
    $("feedback").className = "feedback";

    var box = $("answers");
    box.innerHTML = "";
    makeOptions(currentWord.l).forEach(function (letter) {
      var btn = document.createElement("button");
      btn.className = "answer";
      btn.type = "button";
      btn.textContent = letter;
      btn.addEventListener("click", function () { choose(btn, letter); });
      box.appendChild(btn);
    });
  }

  function choose(btn, letter) {
    if (locked) return;
    locked = true;
    var all = document.querySelectorAll(".answer");
    all.forEach(function (b) { b.disabled = true; });

    var feedback = $("feedback");
    var info = currentWord.w + " (" + currentWord.en + ") starts with " + currentWord.l;
    if (letter === currentWord.l) {
      correct++;
      btn.classList.add("right");
      feedback.textContent = "Correct! +" + COINS_PER_CORRECT + " coins. " + info + ".";
      feedback.className = "feedback good si";
    } else {
      btn.classList.add("wrong");
      all.forEach(function (b) {
        if (b.textContent === currentWord.l) b.classList.add("right");
      });
      feedback.textContent = "Not quite. " + info + ".";
      feedback.className = "feedback bad si";
    }
    $("scoreChip").textContent = "Coins: " + (correct * COINS_PER_CORRECT);

    setTimeout(function () {
      current++;
      if (current >= TOTAL_QUESTIONS) finish(); else showQuestion();
    }, 1800);
  }

  // ---------- Finish ----------
  function starsFor(score) {
    if (score >= 9) return 3;
    if (score >= 6) return 2;
    if (score >= 3) return 1;
    return 0;
  }

  function finish() {
    $("barFill").style.width = "100%";
    gameScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    var stars = starsFor(correct);
    var coins = correct * COINS_PER_CORRECT;
    $("resultStars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    $("resultStars").style.color = "#f7b500";
    $("resultTitle").textContent = stars === 3 ? "Amazing work!" : stars === 2 ? "Great job!" : stars === 1 ? "Good try!" : "Keep practising!";
    $("resultScore").textContent = "You got " + correct + " out of " + TOTAL_QUESTIONS + " right.";
    $("resultReward").textContent = "+" + coins + " coins";
    $("saveNote").textContent = "";

    saveRewards(coins, stars).then(function (message) {
      $("saveNote").textContent = message;
    });
  }

  // =====================================================================
  //  SAVING COINS AND STARS
  //  Saves to the logged-in user's account using addRewards() from
  //  userdata.js. If the user is not logged in, or Firebase can't load,
  //  it saves in this browser instead.
  // =====================================================================
  async function saveRewards(coins, stars) {
    try {
      var config = await import("../js/firebase-config.js");
      var userdata = await import("../js/userdata.js");
      var user = config.auth.currentUser;

      if (user) {
        var ok = await userdata.addRewards(user.uid, coins, stars);
        if (ok) {
          var profile = await userdata.getUserProfile(user.uid);
          var total = profile && typeof profile.coins === "number" ? profile.coins : null;
          return total !== null
            ? "Saved to your account. Total coins: " + total
            : "Saved to your account.";
        }
        return "Could not save to your account. Please try again later.";
      }
      return saveOnThisDevice(coins, stars, "Log in to save coins to your account. ");
    } catch (e) {
      console.error("Firebase not available, saving on this device:", e);
      return saveOnThisDevice(coins, stars, "");
    }
  }

  function saveOnThisDevice(coins, stars, prefix) {
    try {
      var saved = JSON.parse(localStorage.getItem("edulankaRewards") || '{"coins":0,"stars":0}');
      saved.coins += coins;
      saved.stars += stars;
      localStorage.setItem("edulankaRewards", JSON.stringify(saved));
      return prefix + "Saved on this device. Total coins: " + saved.coins;
    } catch (e) {
      return "Your coins could not be saved.";
    }
  }

  // ---------- Buttons ----------
  function startGame() {
    current = 0; correct = 0;
    roundWords = shuffle(WORDS).slice(0, TOTAL_QUESTIONS);
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    showQuestion();
  }
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
})();
</script>
</body>
</html>
