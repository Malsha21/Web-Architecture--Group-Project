<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Explorer | EduLanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbf6;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6478;
    --blue: #1a5cff;
    --blue-dark: #1246c9;
    --yellow: #f7b500;
    --yellow-dark: #d98f00;
    --green: #1f9d55;
    --green-soft: #dcf7e6;
    --red: #d64545;
    --red-soft: #fde4e4;
    --mint: #dcfce7;
    --line: #e7e5dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 900; font-size: 22px; color: #1d3a8a; text-decoration: none; }
  .back {
    font-weight: 800; color: var(--ink); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; background: #fff;
  }
  .back:hover { border-color: var(--blue); color: var(--blue); }

  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .panel {
    background: var(--card); border-radius: 32px; padding: 28px;
    box-shadow: 0 10px 30px rgba(20, 33, 61, .08);
  }
  .hidden { display: none !important; }

  /* Start screen */
  .start { text-align: center; }
  .start .icon {
    width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 28px;
    background: var(--mint); display: grid; place-items: center; font-size: 60px;
  }
  .start h1 { font-size: 40px; margin: 0 0 8px; font-weight: 900; }
  .start p { color: var(--muted); font-size: 18px; margin: 0 0 26px; line-height: 1.5; }

  .btn-main {
    font: inherit; font-weight: 900; font-size: 20px; cursor: pointer; border: 0;
    color: #fff; background: var(--blue); padding: 16px 40px; border-radius: 999px;
    box-shadow: 0 5px 0 var(--blue-dark);
  }
  .btn-main:hover { background: #2a68ff; }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-dark); }
  .btn-yellow { background: var(--yellow); color: #3a2a00; box-shadow: 0 5px 0 var(--yellow-dark); }
  .btn-yellow:hover { background: #ffc61f; }
  .btn-yellow:active { box-shadow: 0 2px 0 var(--yellow-dark); }
  .btn-line {
    font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block;
    padding: 14px 30px; border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn-line:hover { border-color: var(--blue); color: var(--blue); }

  /* Game screen */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; font-weight: 800; }
  .chip { background: #fff7db; color: #7a5600; border-radius: 999px; padding: 6px 14px; }
  .bar { height: 14px; background: #eef0f6; border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .35s ease; }

  .question {
    text-align: center; font-weight: 900; font-size: clamp(22px, 5vw, 30px);
    line-height: 1.3; margin: 4px 0 26px; min-height: 80px; display: grid; place-items: center;
  }
  .answers { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .answer {
    font: inherit; font-weight: 800; font-size: 20px; cursor: pointer; text-align: center;
    padding: 16px 14px; border-radius: 20px; border: 2px solid var(--line); background: #fff; color: var(--ink);
    transition: transform .1s ease, border-color .1s ease;
  }
  .answer:hover:not(:disabled) { border-color: var(--blue); transform: translateY(-2px); }
  .answer:disabled { cursor: default; }
  .answer.right { background: var(--green-soft); border-color: var(--green); color: #0f6b38; }
  .answer.wrong { background: var(--red-soft); border-color: var(--red); color: #9b2323; }

  .feedback { text-align: center; font-weight: 700; font-size: 18px; margin-top: 20px; line-height: 1.5; min-height: 54px; }
  .feedback strong { display: block; font-size: 20px; margin-bottom: 2px; }
  .feedback.good strong { color: var(--green); }
  .feedback.bad strong { color: var(--red); }
  .next-row { text-align: center; margin-top: 14px; }

  /* Result screen */
  .result { text-align: center; }
  .stars { font-size: 56px; letter-spacing: 6px; margin-bottom: 6px; }
  .result h2 { font-size: 34px; margin: 0 0 8px; font-weight: 900; }
  .result .score { font-size: 20px; color: var(--muted); margin: 0 0 18px; }
  .reward { display: inline-block; background: #fff7db; color: #7a5600; font-weight: 900; font-size: 22px; padding: 10px 22px; border-radius: 999px; margin-bottom: 8px; }
  .save-note { font-size: 14px; color: var(--muted); margin: 6px 0 26px; min-height: 20px; }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    .panel { padding: 20px; border-radius: 26px; }
    .answer { font-size: 18px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html">EduLanka</a>
  <!-- CHANGE this link to your real Games page address -->
  <a class="back" href="games.html">Back to games</a>
</header>

<main>

  <!-- 1. Start screen -->
  <section class="panel start" id="startScreen">
    <div class="icon" aria-hidden="true">🌏</div>
    <h1>Island Explorer</h1>
    <p>Test what you know about Sri Lanka. Answer 10 questions about our places, nature and history. Every right answer earns you 15 coins.</p>
    <button class="btn-main btn-yellow" id="startBtn">Start exploring</button>
  </section>

  <!-- 2. Game screen -->
  <section class="panel hidden" id="gameScreen" aria-live="polite">
    <div class="hud">
      <span class="chip" id="qCount">Question 1 of 10</span>
      <span class="chip" id="scoreChip">Coins: 0</span>
    </div>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
    <div class="question" id="questionText"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-row"><button class="btn-main hidden" id="nextBtn" type="button">Next question</button></div>
  </section>

  <!-- 3. Result screen -->
  <section class="panel result hidden" id="resultScreen">
    <div class="stars" id="resultStars" aria-hidden="true"></div>
    <h2 id="resultTitle">Well done!</h2>
    <p class="score" id="resultScore"></p>
    <div class="reward" id="resultReward"></div>
    <p class="save-note" id="saveNote"></p>
    <div class="result-actions">
      <button class="btn-main" id="againBtn">Play again</button>
      <a class="btn-line" href="games.html">Back to games</a>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  var TOTAL_QUESTIONS = 10;
  var COINS_PER_CORRECT = 15;

  // q = question, a = right answer, w = three wrong answers, f = fun fact shown after answering
  var QUESTIONS = [
    { q: "Which city is Sri Lanka's largest city and commercial capital?",
      a: "Colombo", w: ["Kandy", "Galle", "Jaffna"],
      f: "Colombo is the biggest city and the centre of business in Sri Lanka." },
    { q: "In which city is Sri Lanka's Parliament?",
      a: "Sri Jayawardenepura Kotte", w: ["Kandy", "Galle", "Anuradhapura"],
      f: "Sri Jayawardenepura Kotte is the official legislative capital, very close to Colombo." },
    { q: "What is the highest mountain in Sri Lanka?",
      a: "Pidurutalagala", w: ["Adam's Peak (Sri Pada)", "Hakgala", "Namunukula"],
      f: "Pidurutalagala is about 2,524 metres high and stands near Nuwara Eliya." },
    { q: "Which is the longest river in Sri Lanka?",
      a: "Mahaweli River", w: ["Kelani River", "Kalu River", "Walawe River"],
      f: "The Mahaweli River flows for about 335 kilometres." },
    { q: "What is Sri Lanka's national flower?",
      a: "Blue water lily (Nil Manel)", w: ["Red rose", "Sunflower", "Jasmine"],
      f: "The blue water lily is called Nil Manel in Sinhala." },
    { q: "What is Sri Lanka's national tree?",
      a: "Ceylon ironwood (Na)", w: ["Coconut palm", "Banyan tree", "Mango tree"],
      f: "The Ceylon ironwood is called Na in Sinhala." },
    { q: "Which bird is Sri Lanka's national bird?",
      a: "Sri Lanka junglefowl", w: ["Peacock", "Crow", "Parrot"],
      f: "The Sri Lanka junglefowl is found only in Sri Lanka." },
    { q: "In which year did Sri Lanka become independent?",
      a: "1948", w: ["1935", "1956", "1972"],
      f: "Independence Day is celebrated every year on 4 February." },
    { q: "Which country did Sri Lanka become independent from?",
      a: "The United Kingdom", w: ["France", "Portugal", "The Netherlands"],
      f: "The Portuguese, Dutch and British each ruled parts of the island before independence." },
    { q: "What was Sri Lanka's old name?",
      a: "Ceylon", w: ["Siam", "Burma", "Formosa"],
      f: "The country was called Ceylon until 1972." },
    { q: "Which ocean surrounds Sri Lanka?",
      a: "Indian Ocean", w: ["Pacific Ocean", "Atlantic Ocean", "Arctic Ocean"],
      f: "Sri Lanka is an island in the Indian Ocean, south of India." },
    { q: "Which country is closest to Sri Lanka, across the Palk Strait?",
      a: "India", w: ["Japan", "Australia", "Thailand"],
      f: "The Palk Strait is a narrow sea between Sri Lanka and India." },
    { q: "Which two languages are the official languages of Sri Lanka?",
      a: "Sinhala and Tamil", w: ["Sinhala and English", "Tamil and Hindi", "English and Hindi"],
      f: "English is used as a link language between the two." },
    { q: "Which animal is on Sri Lanka's national flag?",
      a: "Lion", w: ["Elephant", "Tiger", "Leopard"],
      f: "The golden lion on the flag holds a sword in its right paw." },
    { q: "How many provinces does Sri Lanka have?",
      a: "9", w: ["7", "8", "10"],
      f: "Sri Lanka has 9 provinces and 25 districts." },
    { q: "Which ancient rock fortress is known as the Lion Rock?",
      a: "Sigiriya", w: ["Mihintale", "Ritigala", "Dambulla"],
      f: "Sigiriya was built by King Kashyapa in the 5th century." },
    { q: "Which city is home to the Temple of the Sacred Tooth Relic?",
      a: "Kandy", w: ["Anuradhapura", "Galle", "Jaffna"],
      f: "Kandy also holds the Esala Perahera, a grand festival with decorated elephants." },
    { q: "Which ancient city has the sacred Sri Maha Bodhi tree?",
      a: "Anuradhapura", w: ["Kandy", "Galle", "Jaffna"],
      f: "The Sri Maha Bodhi was planted more than 2,000 years ago." },
    { q: "Which hill town is nicknamed \"Little England\"?",
      a: "Nuwara Eliya", w: ["Galle", "Jaffna", "Matara"],
      f: "Nuwara Eliya has a cool climate and is in the middle of tea country." },
    { q: "Which hill town is famous for the Nine Arch Bridge?",
      a: "Ella", w: ["Kandy", "Galle", "Negombo"],
      f: "The Nine Arch Bridge is a famous railway bridge made of stone and brick." },
    { q: "Which national park is famous for its many leopards?",
      a: "Yala National Park", w: ["Horton Plains", "Udawalawe", "Minneriya"],
      f: "Yala is one of the best places in the world to see wild leopards." },
    { q: "Which rainforest in Sri Lanka is a UNESCO World Heritage Site?",
      a: "Sinharaja", w: ["Wilpattu", "Yala", "Minneriya"],
      f: "Sinharaja is home to many plants and animals found nowhere else." },
    { q: "Which spice is Sri Lanka famous for around the world?",
      a: "Cinnamon", w: ["Saffron", "Wasabi", "Paprika"],
      f: "Ceylon cinnamon is known as \"true cinnamon\"." },
    { q: "In which month is the Sinhala and Tamil New Year celebrated?",
      a: "April", w: ["January", "June", "December"],
      f: "People celebrate with sweets, games and family visits in April." },
    { q: "Which festival remembers the birth, enlightenment and passing away of the Buddha?",
      a: "Vesak", w: ["Poson", "Esala", "Duruthu"],
      f: "During Vesak, people light lanterns and decorate with pandals." },
    { q: "Which city is the main city of the Northern Province?",
      a: "Jaffna", w: ["Galle", "Badulla", "Matara"],
      f: "Jaffna is in the far north of the island." },
    { q: "Which southern town is famous for whale watching?",
      a: "Mirissa", w: ["Kandy", "Anuradhapura", "Badulla"],
      f: "Blue whales can be seen off the coast near Mirissa." },
    { q: "Which town has a famous cave temple with many Buddha statues?",
      a: "Dambulla", w: ["Matara", "Jaffna", "Negombo"],
      f: "The Dambulla cave temple is a UNESCO World Heritage Site." },
    { q: "Which sacred mountain, called Sri Pada, do pilgrims climb at night?",
      a: "Adam's Peak", w: ["Pidurutalagala", "Hakgala", "Knuckles"],
      f: "Many people climb in the dark to watch the sunrise from the top." },
    { q: "Which currency is used in Sri Lanka?",
      a: "Sri Lankan rupee", w: ["Dollar", "Taka", "Baht"],
      f: "The Sri Lankan rupee is written as Rs. or LKR." }
  ];

  var current = 0;
  var correct = 0;
  var locked = false;
  var roundQuestions = [];
  var currentQuestion = null;

  var $ = function (id) { return document.getElementById(id); };
  var startScreen = $("startScreen"), gameScreen = $("gameScreen"), resultScreen = $("resultScreen");

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = rand(0, i);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------- Show a question ----------
  function showQuestion() {
    locked = false;
    currentQuestion = roundQuestions[current];
    $("qCount").textContent = "Question " + (current + 1) + " of " + TOTAL_QUESTIONS;
    $("scoreChip").textContent = "Coins: " + (correct * COINS_PER_CORRECT);
    $("barFill").style.width = (current / TOTAL_QUESTIONS * 100) + "%";
    $("questionText").textContent = currentQuestion.q;
    $("feedback").innerHTML = "";
    $("feedback").className = "feedback";
    $("nextBtn").classList.add("hidden");

    var box = $("answers");
    box.innerHTML = "";
    shuffle([currentQuestion.a].concat(currentQuestion.w)).forEach(function (text) {
      var btn = document.createElement("button");
      btn.className = "answer";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", function () { choose(btn, text); });
      box.appendChild(btn);
    });
  }

  function choose(btn, text) {
    if (locked) return;
    locked = true;
    var all = document.querySelectorAll(".answer");
    all.forEach(function (b) { b.disabled = true; });

    var feedback = $("feedback");
    var title = document.createElement("strong");
    var fact = document.createElement("span");
    fact.textContent = currentQuestion.f;

    if (text === currentQuestion.a) {
      correct++;
      btn.classList.add("right");
      title.textContent = "Correct! +" + COINS_PER_CORRECT + " coins";
      feedback.className = "feedback good";
    } else {
      btn.classList.add("wrong");
      all.forEach(function (b) {
        if (b.textContent === currentQuestion.a) b.classList.add("right");
      });
      title.textContent = "Not quite. The answer is " + currentQuestion.a + ".";
      feedback.className = "feedback bad";
    }
    feedback.innerHTML = "";
    feedback.appendChild(title);
    feedback.appendChild(fact);

    $("scoreChip").textContent = "Coins: " + (correct * COINS_PER_CORRECT);
    $("nextBtn").textContent = current + 1 >= TOTAL_QUESTIONS ? "See my results" : "Next question";
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").focus();
  }

  $("nextBtn").addEventListener("click", function () {
    current++;
    if (current >= TOTAL_QUESTIONS) finish(); else showQuestion();
  });

  // ---------- Finish ----------
  function starsFor(score) {
    if (score >= 9) return 3;
    if (score >= 6) return 2;
    if (score >= 3) return 1;
    return 0;
  }

  function finish() {
    $("barFill").style.width = "100%";
    gameScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    var stars = starsFor(correct);
    var coins = correct * COINS_PER_CORRECT;
    $("resultStars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    $("resultStars").style.color = "#f7b500";
    $("resultTitle").textContent = stars === 3 ? "Amazing explorer!" : stars === 2 ? "Great job!" : stars === 1 ? "Good try!" : "Keep exploring!";
    $("resultScore").textContent = "You got " + correct + " out of " + TOTAL_QUESTIONS + " right.";
    $("resultReward").textContent = "+" + coins + " coins";
    $("saveNote").textContent = "";

    saveRewards(coins, stars).then(function (message) {
      $("saveNote").textContent = message;
    });
  }

  // =====================================================================
  //  SAVING COINS AND STARS
  //  Saves to the logged-in user's account using addRewards() from
  //  userdata.js. If the user is not logged in, or Firebase can't load,
  //  it saves in this browser instead.
  // =====================================================================
  async function saveRewards(coins, stars) {
    try {
      var config = await import("../js/firebase-config.js");
      var userdata = await import("../js/userdata.js");
      var user = config.auth.currentUser;

      if (user) {
        var ok = await userdata.addRewards(user.uid, coins, stars);
        if (ok) {
          var profile = await userdata.getUserProfile(user.uid);
          var total = profile && typeof profile.coins === "number" ? profile.coins : null;
          return total !== null
            ? "Saved to your account. Total coins: " + total
            : "Saved to your account.";
        }
        return "Could not save to your account. Please try again later.";
      }
      return saveOnThisDevice(coins, stars, "Log in to save coins to your account. ");
    } catch (e) {
      console.error("Firebase not available, saving on this device:", e);
      return saveOnThisDevice(coins, stars, "");
    }
  }

  function saveOnThisDevice(coins, stars, prefix) {
    try {
      var saved = JSON.parse(localStorage.getItem("edulankaRewards") || '{"coins":0,"stars":0}');
      saved.coins += coins;
      saved.stars += stars;
      localStorage.setItem("edulankaRewards", JSON.stringify(saved));
      return prefix + "Saved on this device. Total coins: " + saved.coins;
    } catch (e) {
      return "Your coins could not be saved.";
    }
  }

  // ---------- Buttons ----------
  function startGame() {
    current = 0; correct = 0;
    roundQuestions = shuffle(QUESTIONS).slice(0, TOTAL_QUESTIONS);
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    showQuestion();
  }
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
})();
</script>
</body>
</html>
